[package]
name = "zunesha-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local HTTP + WebSocket API bridging the orchestrator core to the dashboard"

[dependencies]
zunesha-core = { path = "../zunesha-core" }
axum = { version = "0.8", features = ["ws", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde_json = "1"
