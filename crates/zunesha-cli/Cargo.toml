[package]
name = "zunesha-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI entrypoint for the local-first AI coding orchestrator"

[[bin]]
name = "zou"
path = "src/main.rs"

[dependencies]
zunesha-core = { path = "../zunesha-core" }
zunesha-api = { path = "../zunesha-api" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
    "sync",
    "signal",
    "net",
] }
