name: docs

# Validates the mdBook in docs/ on every push/PR.
#
# Deployment is handled by Vercel's Git integration: pushes to master build
# the site with vercel.json → scripts/build-docs.sh (pinned mdBook) and
# publish it to https://zunesha-docs.vercel.app. This workflow exists so a
# broken book fails CI even before Vercel sees it, and so PRs are checked.
#
# Local preview: `mdbook serve docs` (or `sh scripts/build-docs.sh` for the
# no-install route).

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/build-docs.sh"
      - "vercel.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/build-docs.sh"
      - "vercel.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - name: Build the book
        run: mdbook build docs
      - name: Upload the built book
        uses: actions/upload-artifact@v4
        with:
          name: docs-book
          path: docs/book
          if-no-files-found: error
