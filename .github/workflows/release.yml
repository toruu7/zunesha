name: release

# Builds `zou-<os>-<arch>.tar.gz` / `.zip` archives (binary + dashboard)
# that install.sh and install.ps1 download. The layout is `zou` (or `zou.exe`)
# at the archive root and `web/out/` next to it.
#
# Trigger: push a tag (git tag v0.1.0 && git push origin v0.1.0).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the assets to
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
            binary: zou
            archive: tar.gz
          # Apple Silicon runner; the x86_64 build cross-compiles on it.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
            binary: zou
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-amd64
            binary: zou
            archive: tar.gz
          # Native Windows build. The MSVC toolchain is preinstalled on the
          # GitHub Windows runner; install.ps1 consumes the resulting zip.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-amd64
            binary: zou.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Validate installer (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: sh -n install.sh

      - name: Validate installer (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\install.ps1 -Help | Out-Null

      - name: Build the dashboard (static export)
        working-directory: web
        run: npm ci && npm run build

      - name: Build the binary
        run: cargo build --release --target ${{ matrix.target }} -p zunesha-cli

      - name: Stage binary + dashboard (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p stage/web
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "stage/${{ matrix.binary }}"
          cp -R web/out stage/web/out
          tar -czf "zou-${{ matrix.asset }}.tar.gz" -C stage .

      - name: Stage binary + dashboard (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/web | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "stage/${{ matrix.binary }}"
          Copy-Item -Recurse web/out stage/web/out
          Compress-Archive -Path stage/* -DestinationPath "zou-${{ matrix.asset }}.zip"

      - name: Verify Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Expand-Archive "zou-${{ matrix.asset }}.zip" -DestinationPath verify
          if (-not (Test-Path "verify/zou.exe")) { throw "archive is missing zou.exe" }
          if (-not (Test-Path "verify/web/out/index.html")) { throw "archive is missing web/out/index.html" }

      - uses: actions/upload-artifact@v4
        with:
          name: zou-${{ matrix.asset }}
          path: zou-${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
          # workflow_dispatch: attach to the tag typed by the user.
          tag_name: ${{ inputs.tag || github.ref_name }}
