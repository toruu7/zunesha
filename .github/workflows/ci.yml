name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Rustdoc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: cargo build --workspace
      - name: End-to-end sweep (git + daemon + WebSockets)
        run: |
          set +e
          sh scripts/e2e.sh > /tmp/zou-e2e.log 2>&1
          rc=$?
          cat /tmp/zou-e2e.log
          if [ "$rc" -ne 0 ]; then
            tail -n 30 /tmp/zou-e2e.log | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$rc"

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer PATH integration
        run: |
          set +e
          sh scripts/test-install.sh > /tmp/zou-installer.log 2>&1
          rc=$?
          cat /tmp/zou-installer.log
          if [ "$rc" -ne 0 ]; then
            tail -n 30 /tmp/zou-installer.log | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$rc"

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the PowerShell installer
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\install.ps1 -Help | Out-Null

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - run: mdbook build docs
